# hw-radar — Python toolchain config (Python Tooling SSOT Standard, contract v1.0).
#
# The MS-0 foundation is built and deployed (Django project + ADR-0010 schema +
# accounts/web/poller apps); the verification gate is LIVE and green (uv · Ruff ·
# BasedPyright strict · pytest + coverage · pip-audit; run `uv run python -m scripts.check`).
# MS-1a..MS-1d (ingestion substrate, matching, catalog seed, connectors, heartbeat) are
# also built and deployed; MS-1e's harness/harvest tooling is merged and deployed pending
# owner ratification. MS-2 scoring is designed but not implemented; MS-3/MS-4 are not built.
# See AGENTS.md for the toolchain contract and docs/specs/hw-radar-master-spec.md for the design.
# Remaining standard deviation (.vscode/ kept git-ignored) is recorded in
# docs/adr/adr-0002-python-tooling-standard-local-deviations.md.

[project]
name = "hw-radar"
version = "0.1.0"
description = "Watches online marketplaces for enterprise/NAS and recertified HDDs/SSDs and scores the best deals."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "django[argon2]>=6.0,<6.1",
    "gunicorn>=26.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13.4",
    "scrapy>=2.18",
]

[dependency-groups]
# pytest floor matches [tool.pytest.ini_options].minversion; ruff>=0.14 is the first
# release with non-preview py314 target-version support.
dev = [
    "basedpyright",
    "coverage[toml]",
    "django-types>=0.24",
    "pip-audit",
    "pytest>=9.0",
    "pytest-django>=4.12",
    "ruff>=0.14",
    "syrupy>=5.4.0",
    "vcrpy>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Directories owned by external programs are never linted/formatted by this standard.
extend-exclude = [".claude", ".agents", ".codex", ".continue"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplification
    "C4",   # comprehensions
    "PIE",  # misc improvements
    "PTH",  # pathlib
    "RET",  # return-value issues
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # formatter owns line wrapping
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # assert is normal in pytest tests if security rules are later enabled
]
"src/hw_radar/*/migrations/*.py" = [
    "RUF012", # generated migrations use mutable class attrs without ClassVar
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/migrations"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "All"
failOnWarnings = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "hw_radar.settings"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
